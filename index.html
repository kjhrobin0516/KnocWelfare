<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국석유공사 사내 복지제도 AI 질의 포털</title>
    <!-- 공사 CI 표준 서체 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworlddotum.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- 문서 처리용 외부 라이브러리 (사내망 차단 시에도 메인 기능이 멈추지 않도록 안전 로드) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>

    <style>
        :root {
            --knoc-navy: #002b66;
            --knoc-navy-dark: #001c44;
            --knoc-blue: #0056b3;
            --knoc-sky: #eaf2fb;
            --knoc-accent: #00a0e9;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-sub: #4b5563;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'KoPubWorldDotum', 'Noto Sans KR', -apple-system, sans-serif;
            letter-spacing: -0.03em;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 상단 헤더 */
        .header {
            width: 100%;
            height: 84px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo-area {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 48px;
            width: auto;
            max-width: 240px;
            object-fit: contain;
            display: block;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-system-tag {
            background-color: var(--knoc-sky);
            color: var(--knoc-navy);
            font-size: 0.88rem;
            font-weight: 700;
            padding: 7px 16px;
            border-radius: 6px;
            border: 1px solid #cfe2f7;
        }

        .btn-settings {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--knoc-navy);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-settings:hover {
            background: #e2e8f0;
            border-color: var(--knoc-blue);
        }

        /* 메인 컨테이너 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
        }

        .intro-section {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .main-title {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--knoc-navy);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .main-title .highlight {
            color: var(--knoc-blue);
        }

        .main-desc {
            font-size: 1.02rem;
            color: var(--text-sub);
            font-weight: 400;
            word-break: keep-all;
        }

        /* 챗봇 대화 카드 */
        .chat-card {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 43, 102, 0.06);
            display: flex;
            flex-direction: column;
            height: 580px;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: #ffffff;
            width: 100%;
        }

        .message-row {
            display: flex;
            gap: 12px;
            max-width: 85%;
            width: fit-content;
            animation: fadeIn 0.25s ease-out;
            text-align: left;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.bot {
            align-self: flex-start;
            justify-content: flex-start;
            text-align: left;
        }

        .message-row.user {
            align-self: flex-end;
            justify-content: flex-end;
            flex-direction: row-reverse;
            text-align: left;
        }

        .bot-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--knoc-navy);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0, 43, 102, 0.2);
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .message-sender {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--knoc-navy);
            margin-bottom: 2px;
            text-align: left;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.98rem;
            line-height: 1.65;
            word-break: break-word;
            white-space: pre-wrap;
            text-align: left;
        }

        .message-row.user .message-bubble {
            background-color: var(--knoc-navy);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message-row.bot .message-bubble {
            background-color: #f1f5f9;
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            text-align: left;
        }

        .chip {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--knoc-navy);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
        }
        .chip:hover {
            background: var(--knoc-sky);
            border-color: var(--knoc-blue);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 4px;
        }

        .typing-indicator .dot {
            width: 7px;
            height: 7px;
            background: var(--knoc-blue);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator .dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* 입력 폼 */
        .chat-input-area {
            padding: 16px 20px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
        }

        .chat-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .chat-input:focus {
            border-color: var(--knoc-blue);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.12);
        }

        .btn-send {
            padding: 14px 24px;
            background-color: var(--knoc-navy);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background-color: var(--knoc-navy-dark);
            transform: translateY(-1px);
        }

        .btn-send:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* 설정 모달창 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 28, 68, 0.45);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 32px;
            width: 100%;
            max-width: 720px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .modal-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--knoc-navy);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-group input[type="password"],
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        /* 파일 업로드 3분할 카드 영역 */
        .upload-section-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--knoc-navy);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--knoc-sky);
        }

        .upload-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 640px) {
            .upload-grid {
                grid-template-columns: 1fr;
            }
        }

        .upload-card {
            background: #f8fafc;
            border: 1.5px dashed #cbd5e1;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            transition: all 0.2s;
        }

        .upload-card:hover {
            background: #f1f5f9;
            border-color: var(--knoc-blue);
        }

        .upload-card-icon {
            font-size: 1.6rem;
        }

        .upload-card-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--knoc-navy);
        }

        .upload-card-desc {
            font-size: 0.75rem;
            color: var(--text-sub);
            line-height: 1.35;
            min-height: 32px;
        }

        .upload-btn {
            background: #ffffff;
            border: 1px solid #94a3b8;
            color: var(--knoc-navy);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            background: var(--knoc-sky);
            border-color: var(--knoc-blue);
        }

        .upload-status {
            font-size: 0.76rem;
            min-height: 20px;
            word-break: break-all;
            color: #64748b;
        }

        .upload-status.ok {
            color: #059669;
            font-weight: 700;
        }

        .upload-status.err {
            color: #dc2626;
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .btn-modal-cancel {
            padding: 10px 20px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn-modal-save {
            padding: 10px 24px;
            background: var(--knoc-navy);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-modal-save:hover {
            background: var(--knoc-navy-dark);
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 0.82rem;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
        }
    </style>
</head>
