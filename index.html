<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국석유공사(KNOC) 사내 복지제도 AI 종합 포털</title>
    <style>
        :root {
            --knoc-navy: #002b66;
            --knoc-navy-dark: #001c44;
            --knoc-blue: #0056b3;
            --knoc-sky: #eaf2fb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        .top-utility-bar { background-color: var(--knoc-navy-dark); color: #cbd5e1; font-size: 12px; padding: 6px 32px; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; }
        .site-header { background-color: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 200; }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 74px; display: flex; align-items: center; justify-content: space-between; }
        .brand-title { font-size: 18px; font-weight: 800; color: var(--knoc-navy); }
        .portal-main { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 22px 24px 40px; }
        .consult-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
        @media (max-width: 1024px) { .consult-grid { grid-template-columns: 1fr; } }
        .chat-card { background-color: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column; height: 600px; overflow: hidden; }
        .chat-card-header { background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #fafbfc; }
        .message-row { display: flex; gap: 12px; max-width: 90%; }
        .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.assistant { align-self: flex-start; }
        .bubble { padding: 14px 18px; border-radius: 14px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
        .message-row.user .bubble { background-color: var(--knoc-navy); color: #ffffff; }
        .message-row.assistant .bubble { background-color: #ffffff; color: var(--text-main); border: 1px solid #e2e8f0; }
        .chat-input-area { padding: 14px 18px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        .chat-input { flex: 1; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 12px 16px; font-size: 14.5px; outline: none; }
        .send-btn { background: var(--knoc-navy); color: #ffffff; border: none; border-radius: 10px; padding: 0 24px; font-weight: 700; cursor: pointer; }
        .side-widget { background: #ffffff; border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; }
        .dept-contact-list { list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .dept-contact-list li { display: flex; justify-content: space-between; padding: 7px 10px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="top-utility-bar">
        <div><span><i class="status-dot"></i><strong>한국석유공사 사규 AI 포털 정상 작동 중</strong></span></div>
        <div>
            <button type="button" onclick="openApiKeyModal()" style="background:#0056b3; color:#ffffff; border:none; border-radius:6px; padding:4px 10px; font-weight:700; cursor:pointer;">🔑 Google AI API 키 설정</button>
        </div>
    </div>

    <!-- API 키 모달 -->
    <div id="apiKeyModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.55); z-index:9999; align-items:center; justify-content:center; padding:16px;">
        <div style="background:#ffffff; border-radius:16px; width:100%; max-width:460px; padding:24px;">
            <h3 style="color:#002b66; font-size:17px; font-weight:800; margin-bottom:10px;">🔑 Gemini API 키 입력</h3>
            <p style="font-size:13px; color:#475569; margin-bottom:12px;">사규 기반 생성 답변을 위해 API 키를 입력해 주세요.</p>
            <input type="password" id="geminiApiKeyInput" placeholder="AIzaSy... 키 입력" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:14px;">
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button type="button" onclick="closeApiKeyModal()" style="padding:8px 14px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; cursor:pointer;">취소</button>
                <button type="button" onclick="saveApiKey()" style="padding:8px 18px; background:#002b66; color:#ffffff; border:none; border-radius:8px; cursor:pointer;">저장</button>
            </div>
        </div>
    </div>

    <header class="site-header">
        <div class="header-inner">
            <div class="brand-box">
                <span class="brand-title">한국석유공사 사내 복지제도 AI 종합 포털</span>
            </div>
        </div>
    </header>

    <main class="portal-main">
        <div class="consult-grid">
            <div class="chat-column">
                <div class="chat-card">
                    <div class="chat-card-header">
                        <span>🤖 KNOC 복지제도 AI 상담 어시스턴트</span>
                        <button type="button" onclick="clearChat()" style="background:#fff; border:1px solid #cbd5e1; border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer;">대화 초기화</button>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="message-row assistant">
                            <div class="bubble">안녕하십니까, 한국석유공사 사내 복지제도 AI 질의 포털입니다. 궁금하신 복지 규정이나 여비, 대부 기준을 자유롭게 질문해 주시기 바랍니다.</div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="userInput" class="chat-input" placeholder="질문 내용을 입력하세요 (예: 팀장이 카자흐스탄 1박 2일 출장 시 여비)" autocomplete="off">
                        <button type="button" id="sendBtn" class="send-btn">전송</button>
                    </div>
                </div>
            </div>

            <aside class="portal-sidebar">
                <div class="side-widget">
                    <div style="font-size:14px; font-weight:800; color:#002b66; margin-bottom:10px; border-bottom:1.5px solid #e2e8f0; padding-bottom:6px;">📞 복지팀 전담 내선번호</div>
                    <ul class="dept-contact-list">
                        <li><span>퇴직연금 · 여비</span><strong>2775</strong></li>
                        <li><span>학자금대부 · 동아리</span><strong>2774</strong></li>
                        <li><span>주택대부 · 어린이집</span><strong>2768</strong></li>
                        <li><span>근태 · 사회보험</span><strong>2773</strong></li>
                    </ul>
                </div>
            </aside>
        </div>
    </main>

    <script>
        const KNOC_DB = [
            { cat: "승진보상금", q: "승진보상금 지급 기준과 횟수는?", a: "확정기여형(DC) 퇴직연금 승진보상금은 승급으로 임금 상승이 발생한 가입자에 대해 승급 전 근무 기간에 대해 추가 부담금을 납입합니다." },
            { cat: "주택자금대부", q: "주택자금대부 자격 및 한도", a: "근속 1년 이상 무주택 직원은 전용면적 85㎡ 이하 주거용 주택의 구입·임차 자금으로 최대 7,000만 원까지 지원받을 수 있습니다." },
            { cat: "국내여비", q: "국내출장 여비 단가", a: "일비 25,000원, 식비 직원 30,000원, 숙박비 서울·광역시 100,000원 상한 실비 지급입니다." },
            { cat: "국외여비", q: "국외여비 기준", a: "여비규정 별표2 국외여비표에 따라 직급별(임원, 부서장, 팀장, 팀원) 및 지역등급(갑지, 을지)별로 일비, 숙박비 상한액, 식비가 다르게 지급됩니다." }
        ];

        function getApiKey() {
            return (localStorage.getItem("KNOC_GEMINI_API_KEY") || "").trim();
        }

        function openApiKeyModal() {
            document.getElementById("geminiApiKeyInput").value = getApiKey();
            document.getElementById("apiKeyModal").style.display = "flex";
        }

        function closeApiKeyModal() {
            document.getElementById("apiKeyModal").style.display = "none";
        }

        function saveApiKey() {
            const key = document.getElementById("geminiApiKeyInput").value.trim();
            if (!key) { alert("API 키를 입력해 주세요."); return; }
            localStorage.setItem("KNOC_GEMINI_API_KEY", key);
            closeApiKeyModal();
            alert("API 키가 저장되었습니다.");
        }

        function clearChat() {
            const box = document.getElementById("chatMessages");
            while (box.children.length > 1) { box.removeChild(box.lastChild); }
        }

        function appendMsg(role, text) {
            const box = document.getElementById("chatMessages");
            const row = document.createElement("div");
            row.className = "message-row " + role;
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;
            row.appendChild(bubble);
            box.appendChild(row);
            box.scrollTop = box.scrollHeight;
            return row;
        }

        async function processQuery() {
            const input = document.getElementById("userInput");
            const q = input.value.trim();
            if (!q) return;
            input.value = "";
            appendMsg("user", q);

            let apiKey = getApiKey();
            if (!apiKey) {
                apiKey = prompt("⚠️ Gemini API 키가 없습니다. 사용할 API 키를 입력해 주세요:");
                if (apiKey) {
                    localStorage.setItem("KNOC_GEMINI_API_KEY", apiKey.trim());
                } else {
                    appendMsg("assistant", "⚠️ API 키가 입력되지 않아 답변을 생성할 수 없습니다. 우측 상단 [Google AI API 키 설정]을 눌러주세요.");
                    return;
                }
            }

            const loading = appendMsg("assistant", "🧠 사규와 기준을 바탕으로 맞춤형 답변을 생성하고 있습니다...");

            try {
                const promptText = "당신은 한국석유공사 복지팀 사규 상담 AI입니다. 다음 사규 데이터를 참고하여 사용자의 질문에 친절하고 정확하게 생성 답변을 작성해주세요. 규정에 없는 내용은 지어내지 말고 담당 부서 내선을 안내하세요.\n\n[사규 데이터]\n" + JSON.stringify(KNOC_DB) + "\n\n[질문]\n" + q;

                const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });

                if (!res.ok) throw new Error("API 요청 실패 (키를 확인해주세요)");
                const data = await res.json();
                const ans = data?.candidates?.[0]?.content?.parts?.[0]?.text;

                loading.remove();
                if (ans) {
                    appendMsg("assistant", ans);
                } else {
                    appendMsg("assistant", "답변을 생성하지 못했습니다.");
                }
            } catch (err) {
                loading.remove();
                appendMsg("assistant", "❌ 오류 발생: " + err.message);
            }
        }

        window.addEventListener("DOMContentLoaded", function() {
            const sendBtn = document.getElementById("sendBtn");
            const inputEl = document.getElementById("userInput");

            if (sendBtn) {
                sendBtn.onclick = processQuery;
            }
            if (inputEl) {
                inputEl.onkeydown = function(e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        processQuery();
                    }
                };
            }
        });
    </script>
</body>
</html>
